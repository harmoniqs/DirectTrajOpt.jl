name: Bug Report
description: File a bug report
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      render: julia
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
